name: Build and Deploy to Production

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/velo-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: '0'
          severity: CRITICAL
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_IDENTITY_WEBHOOK_SECRET: ${{ secrets.STRIPE_IDENTITY_WEBHOOK_SECRET }}
      # Optional: set these repo secrets to keep the GHCR package PRIVATE.
      # If GHCR_PULL_TOKEN is empty, the package is expected to be PUBLIC.
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
      # Spacemail SMTP mailbox password (set as a repo secret). Enables password-reset emails.
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      # Microsoft 365 fallback SMTP mailbox password (set as a repo secret). Enables the OTP fallback relay.
      FALLBACK_SMTP_PASSWORD: ${{ secrets.FALLBACK_SMTP_PASSWORD }}
    steps:
      - name: Deploy to VPS
        id: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          request_pty: true
          command_timeout: 900s
          envs: STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,STRIPE_IDENTITY_WEBHOOK_SECRET,GHCR_PULL_TOKEN,GHCR_PULL_USER,SMTP_PASSWORD,FALLBACK_SMTP_PASSWORD
          script: |
            echo "=========================================="
            echo "🚀 DEPLOYMENT STARTED"
            echo "=========================================="
            echo "⏰ Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "📦 Image: ghcr.io/velocouriersvc/velo-backend:latest"
            echo ""

            # -- Step 0: Update Kubernetes secrets --
            # Each value is written ONLY when the repo secret is non-empty. An
            # unconditional write meant an unset repo secret silently blanked a
            # live value - this is how STRIPE_WEBHOOK_SECRET ended up empty in
            # production, disabling webhook signature verification.
            echo "-- UPDATING SECRETS --"
            set_secret() {
              if [ -n "$2" ]; then
                sudo kubectl -n velo patch secret velo-secrets --type merge                   -p "{\"stringData\":{\"$1\":\"$2\"}}" && echo "velo-secrets $1 set."
              else
                echo "WARNING: $1 repo secret is empty - leaving the existing cluster value untouched."
              fi
            }
            set_secret STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
            set_secret STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
            # Stripe issues a separate signing secret per webhook endpoint, so the
            # Identity endpoint (/api/v1/identity/webhook) cannot share the
            # payments one. Falls back to STRIPE_WEBHOOK_SECRET when unset.
            set_secret STRIPE_IDENTITY_WEBHOOK_SECRET "$STRIPE_IDENTITY_WEBHOOK_SECRET"
            echo ""

            # ── Step 0.1: SMTP config (Spacemail) for password-reset emails ──
            # Non-secret SMTP settings go in velo-config; the password goes in velo-secrets.
            # These keys do not overlap, so envFrom order (config then secret) is irrelevant.
            # Port 465 implicit TLS: the app's SMTP client has no STARTTLS, so 465 + secure=true.
            echo "── UPDATING SMTP CONFIG ──"
            sudo kubectl -n velo patch configmap velo-config --type merge -p '{"data":{
              "SMTP_HOST":"mail.spacemail.com",
              "SMTP_PORT":"465",
              "SMTP_SECURE":"true",
              "SMTP_AUTH":"true",
              "SMTP_USER":"noreply@velocouriersvc.com",
              "SMTP_FROM":"noreply@velocouriersvc.com",
              "SMTP_FROM_NAME":"Velo Courier Services",
              "FALLBACK_SMTP_HOST":"smtp.office365.com",
              "FALLBACK_SMTP_PORT":"587",
              "FALLBACK_SMTP_STARTTLS":"true",
              "FALLBACK_SMTP_AUTH":"true",
              "FALLBACK_SMTP_USER":"noreply@velo-brand.com",
              "FALLBACK_SMTP_FROM":"noreply@velo-brand.com",
              "FALLBACK_SMTP_FROM_NAME":"Velo Courier Services"
            }}' && echo "velo-config SMTP (primary + fallback) set."
            if [ -n "$SMTP_PASSWORD" ]; then
              sudo kubectl -n velo patch secret velo-secrets --type merge \
                -p "{\"stringData\":{\"SMTP_PASSWORD\":\"$SMTP_PASSWORD\"}}" \
                && echo "velo-secrets SMTP_PASSWORD set."
            else
              echo "WARNING: SMTP_PASSWORD repo secret is empty - reset emails will NOT send until it is set."
            fi
            if [ -n "$FALLBACK_SMTP_PASSWORD" ]; then
              sudo kubectl -n velo patch secret velo-secrets --type merge \
                -p "{\"stringData\":{\"FALLBACK_SMTP_PASSWORD\":\"$FALLBACK_SMTP_PASSWORD\"}}" \
                && echo "velo-secrets FALLBACK_SMTP_PASSWORD set."
            else
              echo "WARNING: FALLBACK_SMTP_PASSWORD repo secret is empty - the OTP fallback relay stays dormant until it is set."
            fi
            echo ""

            # ── Step 0.5: Ensure GHCR image-pull access ──
            # Fixes ImagePullBackOff (403) caused by a stale/expired regcred token.
            echo "── ENSURING IMAGE PULL ACCESS ──"
            if [ -n "$GHCR_PULL_TOKEN" ]; then
              # Private package: recreate the pull secret from a long-lived token.
              sudo kubectl -n velo delete secret regcred --ignore-not-found
              sudo kubectl -n velo create secret docker-registry regcred \
                --docker-server=ghcr.io \
                --docker-username="${GHCR_PULL_USER:-velocouriersvc}" \
                --docker-password="$GHCR_PULL_TOKEN"
              echo "regcred recreated from GHCR_PULL_TOKEN (private package)."
            else
              # Public package: remove the stale secret so the image pulls anonymously.
              sudo kubectl -n velo delete secret regcred --ignore-not-found
              echo "regcred removed; expecting a PUBLIC GHCR package for anonymous pull."
            fi
            echo ""

            # ── Step 1: Pre-deploy status ──
            echo "── PRE-DEPLOY STATUS ──"
            sudo kubectl -n velo get pods -l app=velo-api -o wide
            echo ""

            # ── Step 1.5: Ensure a startupProbe exists ──
            # The app boot (TypeORM schema sync + seeds) can exceed the liveness
            # window and get the pod killed mid-boot. A startupProbe holds off
            # liveness/readiness until the app is listening. Idempotent: re-applying
            # the same probe is a no-op (no extra rollout). The VPS has no repo
            # checkout, so we patch inline rather than `kubectl apply -f`.
            echo "── ENSURING STARTUP PROBE ──"
            sudo kubectl -n velo patch deployment velo-api --type='json' -p='[
              {"op":"add","path":"/spec/template/spec/containers/0/startupProbe","value":{"httpGet":{"path":"/","port":"http"},"periodSeconds":10,"failureThreshold":60}}
            ]' || echo "startupProbe patch skipped (already set or patch unsupported)."
            echo ""

            # ── Step 1.6: Ensure ndots:1 ──
            # The node's resolv.conf carries the host provider's search domains and
            # kubelet copies them into every pod. With the default ndots:5, names
            # like api.stripe.com / mail.spacemail.com are tried against those
            # suffixes first and fail before the real name is queried, breaking ALL
            # outbound calls while in-cluster DNS still works. Idempotent.
            echo "── ENSURING DNS ndots:1 ──"
            sudo kubectl -n velo patch deployment velo-api --type merge               -p '{"spec":{"template":{"spec":{"dnsConfig":{"options":[{"name":"ndots","value":"1"}]}}}}}'               || echo "dnsConfig patch skipped."
            echo ""

            # ── Step 2: Restart deployment ──
            echo "── RESTARTING DEPLOYMENT ──"
            sudo kubectl -n velo rollout restart deployment/velo-api

            # ── Step 3: Wait for rollout ──
            echo "── WAITING FOR ROLLOUT (timeout: 600s) ──"
            if sudo kubectl -n velo rollout status deployment/velo-api --timeout=600s; then
              echo ""
              echo "── POST-DEPLOY STATUS ──"
              sudo kubectl -n velo get pods -l app=velo-api -o wide
              echo ""

              # ── Step 4: Health check ──
              echo "── HEALTH CHECK ──"
              sleep 5
              HEALTH=$(sudo kubectl -n velo exec deploy/velo-api -- wget -qO- http://localhost:3000/health 2>/dev/null || echo "UNREACHABLE")
              echo "Health endpoint: $HEALTH"
              echo ""

              # ── Step 5: Recent logs ──
              echo "── RECENT LOGS (last 30 lines) ──"
              sudo kubectl -n velo logs deploy/velo-api --tail=30
              echo ""
              echo "=========================================="
              echo "✅ DEPLOYMENT SUCCESSFUL"
              echo "=========================================="
            else
              echo ""
              echo "=========================================="
              echo "❌ ROLLOUT FAILED - COLLECTING DIAGNOSTICS"
              echo "=========================================="

              echo ""
              echo "── POD STATUS ──"
              sudo kubectl -n velo get pods -l app=velo-api -o wide
              echo ""

              echo "── POD DESCRIPTIONS ──"
              sudo kubectl -n velo describe pods -l app=velo-api | tail -60
              echo ""

              echo "── POD LOGS (last 50 lines) ──"
              sudo kubectl -n velo logs deploy/velo-api --tail=50 --all-containers=true
              echo ""

              echo "── EVENTS ──"
              sudo kubectl -n velo get events --sort-by='.lastTimestamp' | tail -20
              echo ""

              echo "=========================================="
              echo "❌ DEPLOYMENT FAILED"
              echo "=========================================="
              exit 1
            fi

      - name: Deployment summary
        if: always()
        env:
          # Passed as environment variables, never interpolated into the script
          # body. A commit message is attacker-controlled text: inlined with the
          # ${{ }} syntax it gets pasted into the shell and executed, and this
          # step runs with STRIPE_SECRET_KEY, SMTP_PASSWORD and GHCR_PULL_TOKEN
          # in scope, so a message containing $(...) could read them straight out.
          #
          # It also simply broke: a multi-line message turned its second line
          # into a command and failed the job with "command not found", long
          # after the deploy itself had already succeeded.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          # Subject line only, with table pipes escaped so they cannot break the row.
          SUBJECT=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | tr -d '\r' | sed 's/|/\&#124;/g')

          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            echo "## Deployment Successful" >> $GITHUB_STEP_SUMMARY
            STATUS="Success"
          else
            echo "## Deployment Failed" >> $GITHUB_STEP_SUMMARY
            STATUS="Failed"
          fi

          {
            echo ""
            echo "| Detail | Value |"
            echo "|--------|-------|"
            echo "| **Status** | ${STATUS} |"
            echo "| **Commit** | \`${COMMIT_SHA}\` |"
            echo "| **Author** | ${COMMIT_AUTHOR} |"
            echo "| **Message** | ${SUBJECT} |"
            echo "| **Time** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"
          } >> $GITHUB_STEP_SUMMARY

          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            echo "| **Image** | \`ghcr.io/velocouriersvc/velo-backend:latest\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the **Deploy to VPS** step logs above for full diagnostics." >> $GITHUB_STEP_SUMMARY
          fi