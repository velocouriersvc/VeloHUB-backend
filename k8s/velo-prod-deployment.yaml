apiVersion: apps/v1
kind: Deployment
metadata:
  name: velo-api
  namespace: velo
  labels:
    app: velo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: velo-api
  template:
    metadata:
      labels:
        app: velo-api
    spec:
      # The node's resolv.conf carries the host provider's search domains
      # (is.cc, trouble-free.net, interserver.net) and kubelet copies them into
      # every pod. With the default ndots:5, a name like "api.stripe.com" is
      # tried against each of those suffixes first and the lookup fails before
      # the real name is ever queried, so ALL outbound calls (Stripe, SMTP)
      # died with ENOTFOUND while in-cluster DNS kept working. ndots:1 makes any
      # dotted name resolve directly; bare service names still use the search list.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      # This secret must be created with kubectl create secret docker-registry regcred ...
      imagePullSecrets:
        - name: regcred
      containers:
        - name: velo-api
          # Image hosted on GitHub Container Registry - change owner/name/tag if needed
          image: ghcr.io/velocouriersvc/velo-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: velo-config
            - secretRef:
                name: velo-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Startup can take a while: image pull + TypeORM schema sync + boot seeds.
          # The startupProbe holds off liveness/readiness (and prevents a mid-boot
          # liveness kill / crash loop) until the app is actually listening.
          # 30 x 10s = up to 300s allowed for first byte.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
      restartPolicy: Always
