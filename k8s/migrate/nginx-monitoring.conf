# Nginx reverse proxy for Grafana (monitoring)
# Domain: monitoring.velocouriersvc.com -> k3s Grafana NodePort 30300
#
# Place at: /etc/nginx/sites-available/monitoring.velocouriersvc.com
# Symlink:  ln -sf /etc/nginx/sites-available/monitoring.velocouriersvc.com /etc/nginx/sites-enabled/
# Then run: certbot --nginx -d monitoring.velocouriersvc.com   (after DNS points to this host)

server {
    listen 80;
    server_name monitoring.velocouriersvc.com;

    location / {
        proxy_pass http://127.0.0.1:30300;
        proxy_http_version 1.1;

        # Grafana live tail / websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
