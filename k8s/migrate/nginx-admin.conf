# Nginx reverse proxy for the Velo Admin dashboard
# Domain: admin.velocouriersvc.com -> docker container velo-frontend on 127.0.0.1:8080
#
# Place at: /etc/nginx/sites-available/admin.velocouriersvc.com
# Symlink:  ln -sf /etc/nginx/sites-available/admin.velocouriersvc.com /etc/nginx/sites-enabled/
# Then run: certbot --nginx -d admin.velocouriersvc.com   (after DNS points to this host)

server {
    listen 80;
    server_name admin.velocouriersvc.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
